services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelbattle
      POSTGRES_USER: pixelbattle
      POSTGRES_PASSWORD: pixelbattle
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelbattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

  realtime:
    build: ../services/realtime-go
    env_file:
      - path: ../.env
        required: false
    environment:
      GO_HTTP_ADDR: :8080
      GO_DEV_IN_MEMORY: "false"
      GO_ALLOWED_ORIGIN: https://pixelbattle.redjex.bond
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgres://pixelbattle:pixelbattle@postgres:5432/pixelbattle?sslmode=disable
      REDIS_CONSUMER_NAME: realtime-writer-${HOSTNAME:-local}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-86400}
    restart: unless-stopped
    stop_grace_period: 30s
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres, redis]

  api:
    build: ../services/api-python
    env_file:
      - path: ../.env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres]
    environment:
      API_WORKERS: 4
      API_LIMIT_CONCURRENCY: 2000
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-86400}
    restart: unless-stopped

  bot:
    build: ../services/bot-python
    env_file:
      - path: ../.env
        required: false
    environment:
      MINI_APP_URL: https://pixelbattle.redjex.bond
      MINI_APP_LINK: https://t.me/IdeaBattleBot/pixelbattle
      MAIN_IMAGE_URL: https://pixelbattle.redjex.bond/assets/main.png
      REDIS_URL: redis://redis:6379/0
      REALTIME_URL: http://realtime:8080
    restart: unless-stopped
    depends_on: [web, redis]

  web:
    build: ../apps/web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [realtime, api]

volumes:
  postgres-data:
  redis-data:
