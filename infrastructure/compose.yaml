services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelbattle
      POSTGRES_USER: pixelbattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [storage]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelbattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    networks: [storage]

  realtime:
    build: ../services/realtime-go
    env_file:
      - path: ../.env
        required: false
    environment:
      GO_HTTP_ADDR: :8080
      GO_DEV_IN_MEMORY: "false"
      GO_ALLOWED_ORIGIN: https://pixelbattle.redjex.bond
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: ${POSTGRES_DSN:?Set POSTGRES_DSN with the matching database password}
      REDIS_CONSUMER_NAME: realtime-writer-${HOSTNAME:-local}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-86400}
      TROPHY_REWARDS_DIR: /run/secrets/pixelbattle-trophy-rewards
      RECORDING_STATE_PATH: /var/lib/pixelbattle-recording/state.json
    volumes:
      - ../private/trophy-rewards:/run/secrets/pixelbattle-trophy-rewards:ro
      - ../private/recording:/var/lib/pixelbattle-recording
    restart: unless-stopped
    stop_grace_period: 30s
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres, redis]
    networks: [default, storage]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  api:
    build: ../services/api-python
    env_file:
      - path: ../.env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    environment:
      API_WORKERS: 4
      API_LIMIT_CONCURRENCY: 200
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-86400}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  bot:
    build: ../services/bot-python
    env_file:
      - path: ../.env
        required: false
    environment:
      MINI_APP_URL: https://pixelbattle.redjex.bond
      MINI_APP_LINK: https://t.me/IdeaBattleBot/pixelbattle
      MAIN_IMAGE_URL: https://pixelbattle.redjex.bond/assets/main.png
      REDIS_URL: redis://redis:6379/0
      REALTIME_URL: http://realtime:8080
    restart: unless-stopped
    depends_on: [web, redis]
    networks: [default, storage]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build: ../apps/web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [realtime, api]

volumes:
  postgres-data:
  redis-data:

networks:
  storage:
    internal: true
